<style>
:root{--bg:#0a0a0d;--card:#14141a;--line:#23232c;--tx:#ececf1;--mu:#8b8b99;--ac:#8ea2ff;--ok:#5ad19a;--ko:#ff7a8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) 20px 12px;background:rgba(10,10,13,.85);backdrop-filter:blur(14px)}
header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.5px}
header small{display:block;color:var(--mu);font-size:12px;font-weight:400;letter-spacing:0}
main{padding:4px 16px 110px;max-width:640px;margin:auto}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,a.b{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ib{padding:8px;border-radius:12px;color:var(--mu)}
h2{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mu);margin:26px 4px 10px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.meta{font-size:12px;color:var(--mu)}
.card h3{margin:6px 0 6px;font-size:17px;line-height:1.3;letter-spacing:-.2px}
.card p{margin:0;color:#c4c4cf;font-size:15px}
.ctx{margin-top:12px;padding:10px 12px;border-left:2px solid var(--ac);background:rgba(142,162,255,.07);border-radius:0 10px 10px 0;font-size:14px;color:#c4c4cf}
.ctx b{display:block;color:var(--ac);font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.ctx.bad{border-left-color:var(--ko);background:rgba(255,122,138,.07)}
.ctx.bad b{color:var(--ko)}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acts button,.acts a,.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:#1c1c25;color:var(--tx);font-size:13px;text-decoration:none}
.say.on{background:var(--ac);color:#0a0a0d}
.chip{display:inline-block;font-size:11px;color:var(--ac);background:rgba(142,162,255,.1);padding:3px 10px;border-radius:999px}
.chip.tuto{color:var(--ok);background:rgba(90,209,154,.12)}
.keep{margin-top:12px;font-size:14px;color:var(--ok)}
.steps{margin:12px 0 0;padding-left:22px;color:#c4c4cf;font-size:15px}
.steps li{margin-bottom:8px;padding-left:2px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:8px 10px calc(env(safe-area-inset-bottom) + 6px);background:rgba(10,10,13,.9);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);padding:6px 16px}
nav button.on{color:var(--ac)}
.empty{color:var(--mu);text-align:center;padding:40px 10px}
.big{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.big .i{width:26px;height:26px;color:var(--ac)}
.big b{display:block}.big span{color:var(--mu);font-size:13px}
.stat{display:flex;align-items:center;gap:14px}
.stat svg{width:56px;height:56px;flex:none}
.stat b{font-size:17px;display:block}
.q{font-size:19px;font-weight:600;margin:10px 0 18px;line-height:1.35}
.ch{display:block;width:100%;text-align:left;padding:14px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.ch.ok{border-color:var(--ok);background:rgba(90,209,154,.1)}
.ch.bad{border-color:var(--ko);background:rgba(255,122,138,.1)}
.prog{height:3px;background:var(--line);border-radius:3px;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--ac);border-radius:3px}
.nx{width:100%;padding:14px;border-radius:14px;background:var(--ac);color:#0a0a0d;font-weight:600;margin-top:12px}
.nx.alt{background:none;border:1px solid var(--ko);color:var(--ko)}
.rec{border-left:3px solid var(--mu)}.rec.ok{border-left-color:var(--ok)}.rec.ko{border-left-color:var(--ko)}
select,input[type=range]{width:100%;margin:8px 0;background:#1c1c25;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
details summary{color:var(--mu);font-size:13px;margin:20px 4px 10px;cursor:pointer}
.sm{color:var(--mu);font-size:13px}
</style></head><body>
